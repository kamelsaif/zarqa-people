name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 scripts/package-cloud.py
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-packages
          path: |
            artifacts/Zarqa-People-GoDaddy.zip
            artifacts/Zarqa-People-Cloud-Backend.zip
            artifacts/Zarqa-People-GitHub.zip
